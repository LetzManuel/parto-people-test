    <style>
      .diary-loader { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 12px 0; color: var(--ink-2, #5B6764); font: 500 13.5px/1.4 "Inter Variable", "Inter", "Segoe UI", system-ui, sans-serif; }

      .diary-loader .dl-ink1 { animation: dl-ink1 2.6s linear infinite; }
      .diary-loader .dl-ink2 { animation: dl-ink2 2.6s linear infinite; }
      .diary-loader .dl-pen { animation: dl-pen 2.6s linear infinite; }
      .diary-loader .dl-pen-hand { animation: dl-hand .26s ease-in-out infinite alternate; }
      .diary-loader .dl-nib { fill: var(--ink, #101917); }
      .diary-loader .dl-barrel { fill: var(--ink, #101917); }

      @keyframes dl-hand { from { transform: translateY(-1.2px); } to { transform: translateY(1.2px); } }

        .diary-loader .dl-ink1, .diary-loader .dl-ink2, .diary-loader .dl-pen-hand { animation: none; stroke-dashoffset: 0; }
